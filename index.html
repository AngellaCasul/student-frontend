<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Attendance</title>
  <style>
    :root {
      --bg: #0d0d10;
      --surface: #17171c;
      --text: #f3efe3;
      --muted: #b8b09a;
      --gold: #f5c542;
      --gold-deep: #c9a227;
      --line: rgba(212, 175, 55, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Two-column layout */
    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      min-height: 100vh;
    }

    /* Left sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 56px 32px 40px;
      background:
        radial-gradient(ellipse at top left, rgba(245, 197, 66, 0.3), transparent 65%),
        linear-gradient(180deg, #2a2108 0%, #14110a 70%, var(--bg) 100%);
      border-right: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold-deep);
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(2.2rem, 3.4vw, 3rem);
      line-height: 1.1;
      color: var(--gold);
      background: linear-gradient(135deg, #ffe08a, #f5c542 50%, #c9a227);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Form */
    form {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    input, select {
      background: var(--surface);
      border: 1px solid #3a3320;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      color-scheme: dark;
    }
    form input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 14px;
    }
    input::placeholder { color: #8a8470; }
    input:focus, select:focus {
      outline: 2px solid var(--gold);
      border-color: transparent;
    }
    button {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      color: #1a1405;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    button:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
      box-shadow: 0 8px 24px rgba(245, 197, 66, 0.35);
    }
    button:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(245, 197, 66, 0.25);
    }

    /* Right side */
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 40px 80px;
    }

    /* Summary counters */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid #2b2618;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .stat:hover { transform: translateY(-3px); border-color: var(--gold-deep); }
    .stat-value {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--gold);
    }
    .stat-label {
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h2 {
      margin: 0 0 16px;
      padding-left: 12px;
      border-left: 4px solid var(--gold);
      font-size: 1.6rem;
    }

    /* Attendance by date */
    .by-date { margin-bottom: 44px; }
    .date-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .date-controls input {
      padding: 10px 12px;
    }
    button.chip {
      display: inline-block;
      width: auto;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      background: var(--surface);
      color: var(--gold);
      border: 1px solid var(--line);
    }
    button.chip:hover {
      transform: scale(1.05);
      filter: none;
      box-shadow: none;
      border-color: var(--gold);
      background: #1d1c22;
    }
    button.chip:active { transform: scale(0.96); }
    button.chip.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      color: #1a1405;
      border-color: transparent;
    }
    button.chip.active:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    }
    .date-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .chips-label {
      color: var(--muted);
      font-size: 13px;
    }
    .date-note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .group {
      background: var(--surface);
      border: 1px solid #2b2618;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .group-head {
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }
    .col h4 {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .col.present h4 { color: #7bd88f; }
    .col.absent h4 { color: #ff8a80; }
    .col ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }
    .col .none { margin: 0; color: var(--muted); font-size: 14px; }
    .hint { color: var(--muted); padding: 8px 0; }

    /* Search and filters */
    .toolbar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .toolbar input, .toolbar select {
      width: 100%;
      padding: 11px 12px;
    }
    .result-count {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    h3 {
      margin: 26px 0 10px;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Student cards */
    .card {
      background: var(--surface);
      border: 1px solid #2b2618;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: default;
      transition: transform 0.2s ease, border-color 0.2s ease,
                  box-shadow 0.2s ease, background 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: var(--gold-deep);
      background: #1d1c22;
      box-shadow: 0 10px 28px rgba(245, 197, 66, 0.18);
    }
    .card:active {
      transform: translateY(0) scale(0.99);
      box-shadow: 0 2px 8px rgba(245, 197, 66, 0.12);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--gold);
      font-size: 12px;
      white-space: nowrap;
    }
    .meta {
      margin-top: 2px;
      color: var(--gold-deep);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .dates {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty { color: var(--muted); padding: 20px 0; }

    /* Narrower screens */
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 360px 1fr; }
      .container { padding: 48px 28px 80px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar #search { grid-column: 1 / -1; }
    }
    /* Phones and small tablets: stack the columns */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 48px 20px 40px;
      }
      .container { padding: 36px 20px 60px; }
    }
    @media (max-width: 560px) {
      .toolbar { grid-template-columns: 1fr; }
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="eyebrow">Lab Attendance System</p>
      <h1>Record Attendance</h1>
      <form id="dataForm">
        <input type="text" id="studentName" placeholder="Student name" required>
        <input type="text" id="subjectName" placeholder="Subject name" required>
        <input type="text" id="course" placeholder="Course (e.g., IT3-A)" required>
        <input type="date" id="date" required>
        <button type="submit">Submit to Database</button>
      </form>
    </aside>

    <main class="container">
      <section class="stats">
        <div class="stat"><div class="stat-value" id="statStudents">0</div><div class="stat-label">Students</div></div>
        <div class="stat"><div class="stat-value" id="statCourses">0</div><div class="stat-label">Courses</div></div>
        <div class="stat"><div class="stat-value" id="statDays">0</div><div class="stat-label">Lab days recorded</div></div>
        <div class="stat"><div class="stat-value" id="statLatest">-</div><div class="stat-label">Latest date recorded</div></div>
      </section>

      <section class="by-date">
        <h2>Attendance by Date</h2>
        <div class="date-controls">
          <input type="date" id="viewDate">
          <button type="button" class="chip" id="btnToday">Today</button>
          <button type="button" class="chip" id="btnYesterday">Yesterday</button>
        </div>
        <div class="date-chips" id="dateChips"></div>
        <p class="date-note">Absent means the student is in the same course and subject but has no entry for that date.</p>
        <div id="dateResult"></div>
      </section>

      <h2>Attendance Records</h2>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Search student, subject or course">
        <select id="courseFilter"></select>
        <select id="subjectFilter"></select>
        <select id="sortBy">
          <option value="group">Group by course</option>
          <option value="az">Name A-Z</option>
          <option value="za">Name Z-A</option>
          <option value="most">Most days present</option>
          <option value="least">Fewest days present</option>
        </select>
      </div>
      <p class="result-count" id="resultCount"></p>

      <div id="recordsContainer">Loading...</div>
    </main>
  </div>

  <script>
    const API_URL = 'https://studentapibackend.vercel.app/api';
    let allRecords = [];

    const $ = (id) => document.getElementById(id);

    function formatDate(value) {
      return new Date(value).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'
      });
    }

    function dayKey(value) {
      return new Date(value).toISOString().slice(0, 10);
    }

    // Local calendar date as YYYY-MM-DD (offsetDays = 1 means yesterday)
    function localKey(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() - offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function fillSelect(select, values, allLabel) {
      const current = select.value;
      select.textContent = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = allLabel;
      select.appendChild(all);
      values.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        select.appendChild(o);
      });
      select.value = values.includes(current) ? current : '';
    }

    function updateStats() {
      const days = new Set();
      let latest = null;
      allRecords.forEach(r => (r.attendance || []).forEach(a => {
        days.add(dayKey(a.date));
        const t = new Date(a.date).getTime();
        if (latest === null || t > latest) latest = t;
      }));
      $('statStudents').textContent = allRecords.length;
      $('statCourses').textContent = new Set(allRecords.map(r => r.course)).size;
      $('statDays').textContent = days.size;
      $('statLatest').textContent = latest ? formatDate(latest) : '-';
    }

    function updateFilters() {
      const courses = [...new Set(allRecords.map(r => r.course))].sort();
      const subjects = [...new Set(allRecords.map(r => r.subjectName))].sort();
      fillSelect($('courseFilter'), courses, 'All courses');
      fillSelect($('subjectFilter'), subjects, 'All subjects');
    }

    /* ---------- Attendance by date ---------- */
    function recordedDays() {
      const set = new Set();
      allRecords.forEach(r => (r.attendance || []).forEach(a => set.add(dayKey(a.date))));
      return [...set].sort().reverse();
    }

    function selectDate(key) {
      $('viewDate').value = key;
      renderDateChips();
      renderDateView();
    }

    function renderDateChips() {
      const box = $('dateChips');
      box.textContent = '';
      const days = recordedDays();
      if (days.length === 0) return;
      const label = document.createElement('span');
      label.className = 'chips-label';
      label.textContent = 'Recorded dates:';
      box.appendChild(label);
      days.forEach(k => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (k === $('viewDate').value ? ' active' : '');
        b.textContent = formatDate(k);
        b.addEventListener('click', () => selectDate(k));
        box.appendChild(b);
      });
    }

    function buildColumn(title, cls, names) {
      const col = document.createElement('div');
      col.className = 'col ' + cls;
      const h = document.createElement('h4');
      h.textContent = title + ' (' + names.length + ')';
      col.appendChild(h);
      if (names.length === 0) {
        const none = document.createElement('p');
        none.className = 'none';
        none.textContent = 'None';
        col.appendChild(none);
      } else {
        const ul = document.createElement('ul');
        names.forEach(n => {
          const li = document.createElement('li');
          li.textContent = n;
          ul.appendChild(li);
        });
        col.appendChild(ul);
      }
      return col;
    }

    function renderDateView() {
      const key = $('viewDate').value;
      const out = $('dateResult');
      out.textContent = '';

      if (!key) {
        const p = document.createElement('p');
        p.className = 'hint';
        p.textContent = 'Choose a date to see who was present and who was absent.';
        out.appendChild(p);
        return;
      }

      const groups = {};
      allRecords.forEach(r => {
        const g = r.course + ' - ' + r.subjectName;
        (groups[g] = groups[g] || []).push(r);
      });

      const byName = (a, b) => a.localeCompare(b);
      let shown = 0;

      Object.keys(groups).sort().forEach(g => {
        const members = groups[g];
        const isPresent = (r) =>
          (r.attendance || []).some(a => dayKey(a.date) === key);
        const present = members.filter(isPresent).map(r => r.studentName).sort(byName);
        if (present.length === 0) return; // nobody attended, so not a recorded lab day
        const absent = members.filter(r => !isPresent(r)).map(r => r.studentName).sort(byName);

        const card = document.createElement('div');
        card.className = 'group';
        const head = document.createElement('div');
        head.className = 'group-head';
        head.textContent = g;
        const cols = document.createElement('div');
        cols.className = 'cols';
        cols.appendChild(buildColumn('Present', 'present', present));
        cols.appendChild(buildColumn('Absent', 'absent', absent));
        card.appendChild(head);
        card.appendChild(cols);
        out.appendChild(card);
        shown++;
      });

      if (shown === 0) {
        const p = document.createElement('p');
        p.className = 'hint';
        p.textContent = 'No attendance recorded on ' + formatDate(key) +
          '. Try one of the recorded dates above.';
        out.appendChild(p);
      }
    }

    /* ---------- Student list ---------- */
    function buildCard(r, showMeta) {
      const card = document.createElement('div');
      card.className = 'card';

      const top = document.createElement('div');
      top.className = 'card-top';
      const name = document.createElement('strong');
      name.textContent = r.studentName;
      const badge = document.createElement('span');
      badge.className = 'badge';
      const n = (r.attendance || []).length;
      badge.textContent = n + (n === 1 ? ' day' : ' days');
      top.appendChild(name);
      top.appendChild(badge);
      card.appendChild(top);

      if (showMeta) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = r.course + ' - ' + r.subjectName;
        card.appendChild(meta);
      }

      const dates = document.createElement('div');
      dates.className = 'dates';
      const list = (r.attendance || []).map(a => formatDate(a.date)).join(', ');
      dates.textContent = 'Present: ' + (list || 'none');
      card.appendChild(dates);
      return card;
    }

    function render() {
      const q = $('search').value.trim().toLowerCase();
      const course = $('courseFilter').value;
      const subject = $('subjectFilter').value;
      const sort = $('sortBy').value;
      const container = $('recordsContainer');

      let list = allRecords.filter(r =>
        (!course || r.course === course) &&
        (!subject || r.subjectName === subject) &&
        (!q ||
          (r.studentName || '').toLowerCase().includes(q) ||
          (r.subjectName || '').toLowerCase().includes(q) ||
          (r.course || '').toLowerCase().includes(q))
      );

      const byName = (a, b) => (a.studentName || '').localeCompare(b.studentName || '');
      const count = (r) => (r.attendance || []).length;

      if (sort === 'group') {
        list.sort((a, b) =>
          (a.course || '').localeCompare(b.course || '') ||
          (a.subjectName || '').localeCompare(b.subjectName || '') ||
          byName(a, b));
      } else if (sort === 'az') {
        list.sort(byName);
      } else if (sort === 'za') {
        list.sort((a, b) => byName(b, a));
      } else if (sort === 'most') {
        list.sort((a, b) => count(b) - count(a) || byName(a, b));
      } else if (sort === 'least') {
        list.sort((a, b) => count(a) - count(b) || byName(a, b));
      }

      $('resultCount').textContent =
        'Showing ' + list.length + ' of ' + allRecords.length + ' students';

      container.textContent = '';
      if (list.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = allRecords.length === 0
          ? 'No records found.'
          : 'No students match your search or filters.';
        container.appendChild(p);
        return;
      }

      if (sort === 'group') {
        let lastGroup = '';
        list.forEach(r => {
          const group = r.course + ' - ' + r.subjectName;
          if (group !== lastGroup) {
            const h = document.createElement('h3');
            h.textContent = group;
            container.appendChild(h);
            lastGroup = group;
          }
          container.appendChild(buildCard(r, false));
        });
      } else {
        list.forEach(r => container.appendChild(buildCard(r, true)));
      }
    }

    async function loadRecords() {
      try {
        const response = await fetch(API_URL);
        const records = await response.json();
        if (!Array.isArray(records)) throw new Error('Bad response');
        allRecords = records;
        updateStats();
        updateFilters();
        render();
        renderDateChips();
        renderDateView();
      } catch (error) {
        $('recordsContainer').textContent = 'Error loading records.';
      }
    }

    ['search', 'courseFilter', 'subjectFilter', 'sortBy'].forEach(id => {
      $(id).addEventListener(id === 'search' ? 'input' : 'change', render);
    });

    $('viewDate').addEventListener('change', () => {
      renderDateChips();
      renderDateView();
    });
    $('btnToday').addEventListener('click', () => selectDate(localKey(0)));
    $('btnYesterday').addEventListener('click', () => selectDate(localKey(1)));

    $('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        studentName: $('studentName').value,
        subjectName: $('subjectName').value,
        course: $('course').value,
        date: $('date').value
      };
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        $('dataForm').reset();
        loadRecords();
      } catch (error) {
        alert('Failed to submit record.');
      }
    });

    loadRecords();
  </script>
</body>
</html>
