<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Attendance</title>
  <style>
    :root {
      --bg: #0d0d10;
      --surface: #17171c;
      --text: #f3efe3;
      --muted: #b8b09a;
      --gold: #f5c542;
      --gold-deep: #c9a227;
      --line: rgba(212, 175, 55, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Full-width header band */
    .hero {
      background:
        radial-gradient(ellipse at top, rgba(245, 197, 66, 0.28), transparent 60%),
        linear-gradient(180deg, #2a2108 0%, #14110a 65%, var(--bg) 100%);
      border-bottom: 1px solid var(--line);
      padding: 64px 20px 72px;
      text-align: center;
    }
    .hero-inner { max-width: 560px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold-deep);
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.1;
      color: var(--gold);
      background: linear-gradient(135deg, #ffe08a, #f5c542 50%, #c9a227);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Form */
    form {
      text-align: left;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    input {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid #3a3320;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      color-scheme: dark;
    }
    input::placeholder { color: #8a8470; }
    input:focus {
      outline: 2px solid var(--gold);
      border-color: transparent;
    }
    button {
        display: block;
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        color: #1a1405;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        button:hover {
        transform: scale(1.04);
        filter: brightness(1.08);
        box-shadow: 0 8px 24px rgba(245, 197, 66, 0.35);
        }
        button:active {
        transform: scale(0.96);
        box-shadow: 0 2px 8px rgba(245, 197, 66, 0.25);
    }

    /* Records */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    h2 {
      margin: 0 0 8px;
      padding-left: 12px;
      border-left: 4px solid var(--gold);
      font-size: 1.6rem;
    }
    h3 {
      margin: 30px 0 10px;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card {
        background: var(--surface);
        border: 1px solid #2b2618;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: default;
        transition: transform 0.2s ease, border-color 0.2s ease,
                    box-shadow 0.2s ease, background 0.2s ease;
        }
        .card:hover {
        transform: translateY(-3px) scale(1.01);
        border-color: var(--gold-deep);
        background: #1d1c22;
        box-shadow: 0 10px 28px rgba(245, 197, 66, 0.18);
        }
        .card:active {
        transform: translateY(0) scale(0.99);
        box-shadow: 0 2px 8px rgba(245, 197, 66, 0.12);
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Lab Attendance System</p>
      <h1>Record Attendance</h1>
      <form id="dataForm">
        <input type="text" id="studentName" placeholder="Student name" required>
        <input type="text" id="subjectName" placeholder="Subject name" required>
        <input type="text" id="course" placeholder="Course (e.g., IT3-A)" required>
        <input type="date" id="date" required>
        <button type="submit">Submit to Database</button>
      </form>
    </div>
  </header>

  <main class="container">
    <h2>Attendance Records</h2>
    <div id="recordsContainer">Loading...</div>
  </main>

  <script>
    const API_URL = 'https://studentapibackend.vercel.app/api';

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'
      });
    }

    async function loadRecords() {
      const container = document.getElementById('recordsContainer');
      try {
        const response = await fetch(API_URL);
        const records = await response.json();
        container.textContent = '';

        if (!Array.isArray(records) || records.length === 0) {
          container.textContent = 'No records found.';
          return;
        }

        let lastGroup = '';
        records.forEach(r => {
          const group = r.course + ' - ' + r.subjectName;
          if (group !== lastGroup) {
            const h = document.createElement('h3');
            h.textContent = group;
            container.appendChild(h);
            lastGroup = group;
          }
          const card = document.createElement('div');
          card.className = 'card';
          const name = document.createElement('strong');
          name.textContent = r.studentName;
          const dates = document.createElement('div');
          dates.className = 'dates';
          const list = (r.attendance || [])
            .map(a => formatDate(a.date))
            .join(', ');
          dates.textContent = 'Present: ' + (list || 'none');
          card.appendChild(name);
          card.appendChild(dates);
          container.appendChild(card);
        });
      } catch (error) {
        container.textContent = 'Error loading records.';
      }
    }

    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        studentName: document.getElementById('studentName').value,
        subjectName: document.getElementById('subjectName').value,
        course: document.getElementById('course').value,
        date: document.getElementById('date').value
      };
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        document.getElementById('dataForm').reset();
        loadRecords();
      } catch (error) {
        alert('Failed to submit record.');
      }
    });

    loadRecords();
  </script>
</body>
</html>
